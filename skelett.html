  <p class="zurueck-zur-startseite"><a href="index.html">&#8592; Zur Startseite</a></p>

  <h1>Das Skelett</h1>

  <p class="anleitung">
    Bei <strong>Lernen</strong> tippst du einen Knochen an und siehst
    seinen Namen auf <strong>Deutsch</strong> und auf
    <strong>Latein</strong> &ndash; und zu welcher <strong>Art</strong>
    er geh&ouml;rt. Schau dir alle an, dann gibt es einen Punkt.<br>
    Bei <strong>Testen</strong> wird ein Name genannt und du suchst den
    passenden Knochen im Bild.
  </p>

  <p id="anzeige"></p>

         Das Skelett von vorne.

         Warum gezeichnet und kein Bild? Weil jeder Knochen
         einzeln anklickbar sein muss. Ein Foto ist eine
         einzige Flaeche - eine Zeichnung besteht aus lauter
         einzelnen Teilen.

         DIE MASSE SIND NICHT GERATEN, SONDERN GEMESSEN.
         Vorlage war images/Skelet Bild.jpg (liegt bewusst
         nicht im Repository - fremde Zeichnung). Das Bild
         wurde zeilenweise nach Knochenpixeln abgesucht.
         Daraus kamen diese Marken, alles Anteile der
         Koerpergroesse:

           Kopf am breitesten  0.050
           Kinn                0.140
           Schluesselbein      0.195
           Rippen              0.203 bis 0.395
           Ellbogen            0.367
           Becken oben         0.415
           Hueftgelenk         0.500
           Fingerspitzen       0.590
           Knie                0.720
           Knoechel            0.950

         Der Koerper ist hier 620 hoch und beginnt bei y=8 -
         jede Marke oben ist mal 620 gerechnet. Ein Test
         rechnet vier davon aus den Zahlen im SVG nach.

         Und: ZWOELF Rippenpaare, nicht fuenf wie im ersten
         Anlauf. Davon gehen 1-7 zum Brustbein (echte Rippen),
         8-10 enden davor (falsche Rippen), 11-12 sind kurz
         und frei.

         Gezeichnet ist nur die LINKE Haelfte. Die rechte ist
         dieselbe Gruppe, mit transform an der Mittellinie
         umgeklappt - so koennen die zwei Seiten nie
         auseinanderlaufen.

         Jeder Knochen traegt data-knochen="...". Das
         JavaScript liest daran ab, welcher gemeint ist.
         Knochen, die es zweimal gibt, tragen denselben Namen -
         darum leuchten beim Antippen beide auf.

         tabindex="0" macht sie mit der Tabulatortaste
         erreichbar.

    <!-- Rechts neben dem Bild: zuerst die Tafel, darunter die
         zwei Knoepfe zum Umschalten. -->
    <div id="tafelspalte">

      <!-- Die weisse Tafel. Sie steht immer da, damit das Bild
           nicht springt, sobald man etwas antippt.
           Drei Zustaende, immer genau einer sichtbar:
             tafel-hinweis  noch nichts gewaehlt
             tafel-inhalt   Lernen: der Name des Knochens
             tafel-frage    Testen: die Frage und die Rueckmeldung -->
      <div id="knochentafel">
        <p id="tafel-hinweis">Tippe einen Knochen an.</p>

        <div id="tafel-inhalt">
          <p id="knochen-deutsch"></p>
          <p id="knochen-latein"></p>
          <p id="knochen-art"></p>
        </div>

        <div id="tafel-frage">
          <p id="frage-zeile"></p>
          <p id="frage-rueckmeldung"></p>
        </div>
      </div>

      <!-- Lernen oder Testen.
           Der Knopf, der gerade gilt, traegt die Klasse "an". -->
      <div id="modus-wahl">
        <button id="knopf-lernen" class="modusknopf an"
                onclick="modusSetzen('lernen')">Lernen</button>
        <button id="knopf-testen" class="modusknopf"
                onclick="modusSetzen('testen')">Testen</button>
      </div>

    </div>
