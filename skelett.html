  <h1>Das Skelett</h1>

  <p class="anleitung">
    Tippe einen Knochen an. Dann siehst du seinen Namen auf
    <strong>Deutsch</strong> und auf <strong>Latein</strong> &ndash; und zu
    welcher <strong>Art</strong> er geh&ouml;rt.<br>
    Schau dir alle an, dann gibt es einen Punkt.
  </p>

    <!-- ============================================
         Das Skelett von vorne.

         Warum gezeichnet und kein Bild? Weil jeder Knochen
         einzeln anklickbar sein muss. Ein Foto ist eine
         einzige Flaeche - eine Zeichnung besteht aus lauter
         einzelnen Teilen.

         DIE MASSE SIND NICHT GERATEN.
         Das Bild ist 620 hoch, das entspricht der ganzen
         Koerpergroesse. Alles andere ist danach gerechnet:

           Kopf         620 / 7,5 = 83   (Kunst-Anatomie:
                                          7 bis 7,5 Kopfhoehen)
           Beckenmitte  bei der Haelfte, also 310
           Femur        rund 25 % der Groesse (Literatur: 27 %)
           Tibia        rund 21 %            (Literatur: 24 %)
           Humerus      rund 16 %            (Literatur: 17 %)
           Elle         rund 14 %
           Femur zu Tibia  1,21 - genau das Verhaeltnis aus
                           der anatomischen Literatur
           Fingerspitzen reichen bis Mitte Oberschenkel

         Und: ZWOELF Rippenpaare, nicht fuenf wie im ersten
         Anlauf. Davon gehen 1-7 zum Brustbein (echte Rippen),
         8-10 enden davor (falsche Rippen), 11-12 sind kurz
         und frei (fluctuantes).

         Jeder Knochen traegt data-knochen="...". Das
         JavaScript liest daran ab, welcher gemeint ist.
         Knochen, die es zweimal gibt, tragen denselben Namen -
         darum leuchten beim Antippen beide auf.

         tabindex="0" macht sie mit der Tabulatortaste
         erreichbar.
         ============================================ -->
