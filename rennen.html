<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">

    <!-- Ohne diese Zeile tut ein Handy so, als waere sein Bildschirm
         980 Pixel breit, und zoomt die Seite winzig heraus.
         width=device-width heisst: nimm die echte Breite. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Das Rennen</title>

    <!-- grund.css gilt auf allen Seiten, rennen.css nur hier. -->
    <link rel="stylesheet" href="css/grund.css">
    <link rel="stylesheet" href="css/rennen.css">
  </head>
<!-- Die Klasse sagt, ob jemand angemeldet ist. js/punkte.js stellt sie
     richtig; das CSS blendet danach ein und aus. So ist von Anfang an
     nichts zu sehen, was man noch nicht sehen darf. -->
<body class="nicht-angemeldet">

  <p class="zurueck-zur-startseite"><a href="index.html">&#8592; Zur Startseite</a></p>

  <h1>Das Rennen</h1>

  <p class="anleitung">
    Fahr mit dem Krankenwagen um die <strong>Ölflecken</strong> und
    <strong>Steine</strong> herum, die auf der Strasse liegen.<br>
    Sammle <strong>Spritzen</strong> &#128137; ein &ndash; jede gibt dir einen
    <strong>Schutzschild</strong> &#128737;, damit überstehst du ein
    Hindernis.<br>
    Steuern mit den <strong>Pfeiltasten</strong> oder den Knöpfen unten,
    starten mit der <strong>Leertaste</strong>.
  </p>

  <p id="anzeige"></p>

  <!-- Das Spielfeld. Die Hindernisse setzt das JavaScript. -->
  <div id="rennen">
    <div id="strasse"></div>
    <!-- Der Krankenwagen von oben gesehen.

         Warum gezeichnet und kein Emoji? Ein Emoji könnte man nicht
         umfärben - genau wie bei der Dachheldin und beim Bett vorher.
         Die Farben stehen gebündelt in css/rennen.css unter
         «HIER RICHTEST DU DEN KRANKENWAGEN EIN».

         Absichtlich KEIN rotes Kreuz: das ist ein geschütztes
         Zeichen. Ein Krankenwagen ist auch am Blaulicht und am
         blauen Streifen zu erkennen - genau wie die Krankenhäuser
         bei der Dachheldin ihr weisses H haben.

         Reihenfolge zählt: Was später kommt, liegt oben. Darum
         zuerst die Räder, dann der Aufbau, und das Blaulicht ganz
         zuletzt. -->
    <div id="wagen">
      <svg class="wagen-bild" viewBox="0 0 50 74" width="50" height="74">

        <!-- Die vier Räder -->
        <rect class="wagen-rad" x="1" y="13" width="5" height="12" rx="2" />
        <rect class="wagen-rad" x="44" y="13" width="5" height="12" rx="2" />
        <rect class="wagen-rad" x="1" y="50" width="5" height="12" rx="2" />
        <rect class="wagen-rad" x="44" y="50" width="5" height="12" rx="2" />

        <!-- Der Aufbau -->
        <rect class="wagen-koerper" x="4" y="2" width="42" height="70" rx="8" />

        <!-- Die Frontscheibe, vorne oben -->
        <path class="wagen-scheibe" d="M11 9 H39 L36 17 H14 Z" />

        <!-- Die Heckscheibe -->
        <path class="wagen-scheibe" d="M13 66 H37 L39 60 H11 Z" />

        <!-- Der blaue Streifen an der Seite -->
        <rect class="wagen-streifen" x="4" y="34" width="42" height="7" />

        <!-- Das Blaulicht auf dem Dach, ganz vorne -->
        <rect class="wagen-licht" x="15" y="4" width="20" height="4" rx="2" />

      </svg>

      <!-- Beim Zusammenstoss versteckt das CSS die Zeichnung und
           zeigt das hier. Vorher stand an dieser Stelle einmal
           innerHTML = "..." - das hätte das ganze SVG zerstört. -->
      <span class="knall">&#128165;</span>
    </div>

    <!-- Liegt über dem Spielfeld: Start- und Schlussmeldung -->
    <div id="tafel"></div>
  </div>

  <!-- Steuerung zum Anklicken, für Laptop ohne Tastatur -->
  <div id="steuerung">
    <button class="steuerknopf" onclick="nachLinks()">&#9664;</button>
    <button class="steuerknopf" onclick="nachRechts()">&#9654;</button>
  </div>

  <script src="js/punkte.js"></script>

  <!-- rangliste.js NACH punkte.js: es braucht serverFragen() und token() von dort. -->
  <script src="js/rangliste.js"></script>
  <script src="js/rennen.js"></script>
</body>
</html>
