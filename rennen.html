<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <title>Das Rennen</title>

    <!-- grund.css gilt auf allen Seiten, rennen.css nur hier. -->
    <link rel="stylesheet" href="css/grund.css">
    <link rel="stylesheet" href="css/rennen.css">
  </head>
<!-- Die Klasse sagt, ob jemand angemeldet ist. js/punkte.js stellt sie
     richtig; das CSS blendet danach ein und aus. So ist von Anfang an
     nichts zu sehen, was man noch nicht sehen darf. -->
<body class="nicht-angemeldet">

  <p class="zurueck-zur-startseite"><a href="index.html">&#8592; Zur Startseite</a></p>

  <h1>Das Rennen</h1>

  <p class="anleitung">
    Fahr mit dem Spitalbett um die Sachen herum, die im Weg liegen &ndash;
    Spritzen &#128137;, Tabletten &#128138; und Pflaster &#129657;.<br>
    Ein Stern &#11088; gibt dir einen <strong>Schutzschild</strong> &#128737;,
    damit überstehst du eines davon.<br>
    Steuern mit den <strong>Pfeiltasten</strong> oder den Knöpfen unten,
    starten mit der <strong>Leertaste</strong>.
  </p>

  <p id="anzeige"></p>

  <!-- Das Spielfeld. Die Hindernisse setzt das JavaScript. -->
  <div id="rennen">
    <div id="strasse"></div>
    <!-- Das Spitalbett von oben gesehen.

         Warum gezeichnet und kein Emoji? Ein Emoji könnte man nicht
         umfärben - genau wie bei der Dachheldin. Und ein Bett mit
         Patientin drauf gibt es als Emoji sowieso nicht.

         Die Farben stehen gebündelt in css/rennen.css unter
         «HIER RICHTEST DU DAS BETT EIN». Dort darfst du drehen.

         Reihenfolge zählt: Was später kommt, liegt oben. Darum
         zuerst die Räder, dann der Rahmen, dann die Decke, und
         der Kopf ganz zuletzt. -->
    <div id="bett">
      <svg class="bett-bild" viewBox="0 0 50 64" width="50" height="64">

        <!-- Die vier Räder -->
        <circle class="bett-rad" cx="7" cy="10" r="3.5" />
        <circle class="bett-rad" cx="43" cy="10" r="3.5" />
        <circle class="bett-rad" cx="7" cy="54" r="3.5" />
        <circle class="bett-rad" cx="43" cy="54" r="3.5" />

        <!-- Der Rahmen und das Kopfteil oben -->
        <rect class="bett-rahmen" x="3" y="2" width="44" height="60" rx="7" />
        <path class="bett-kopfteil" d="M6 2 H44 A3 3 0 0 1 47 5 V7 H3 V5 A3 3 0 0 1 6 2 Z" />

        <!-- Das Kissen -->
        <rect class="bett-kissen" x="11" y="9" width="28" height="12" rx="4" />

        <!-- Die Decke mit einer Falte -->
        <rect class="bett-decke" x="6" y="26" width="38" height="34" rx="5" />
        <path class="bett-falte" d="M9 31 H41" />

        <!-- Die Arme liegen auf der Decke -->
        <rect class="bett-haut" x="6.5" y="27" width="5" height="11" rx="2.5" />
        <rect class="bett-haut" x="38.5" y="27" width="5" height="11" rx="2.5" />

        <!-- Der Kopf, dann die Haare darüber -->
        <circle class="bett-haut" cx="25" cy="16" r="6.5" />
        <path class="bett-haare" d="M18.5 16 Q18.5 9 25 9 Q31.5 9 31.5 16
                                    Q28 12.5 25 12.5 Q22 12.5 18.5 16 Z" />

        <circle class="bett-auge" cx="22.5" cy="17" r="0.9" />
        <circle class="bett-auge" cx="27.5" cy="17" r="0.9" />
        <path class="bett-mund" d="M22.8 19.6 Q25 21.2 27.2 19.6" />

      </svg>

      <!-- Beim Zusammenstoss versteckt das CSS die Zeichnung und
           zeigt das hier. Vorher stand an dieser Stelle einmal
           innerHTML = "..." - das hätte das ganze SVG zerstört. -->
      <span class="knall">&#128165;</span>
    </div>

    <!-- Liegt über dem Spielfeld: Start- und Schlussmeldung -->
    <div id="tafel"></div>
  </div>

  <!-- Steuerung zum Anklicken, für Laptop ohne Tastatur -->
  <div id="steuerung">
    <button class="steuerknopf" onclick="nachLinks()">&#9664;</button>
    <button class="steuerknopf" onclick="nachRechts()">&#9654;</button>
  </div>

  <script src="js/punkte.js"></script>

  <!-- rangliste.js NACH punkte.js: es braucht serverFragen() und token() von dort. -->
  <script src="js/rangliste.js"></script>
  <script src="js/rennen.js"></script>
</body>
</html>
