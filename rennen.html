<!DOCTYPE html>
<html lang="de">

  <p class="zurueck-zur-startseite"><a href="index.html">&#8592; Zur Startseite</a></p>

  <h1>Das Rennen</h1>

  <p class="anleitung">
    Fahr um die Hindernisse &#128679; herum. Ein Stern &#11088; gibt dir einen
    <strong>Schutzschild</strong> &#128737; &ndash; damit übersteht du ein
    Hindernis.<br>
    Steuern mit den <strong>Pfeiltasten</strong> oder den Knöpfen unten.
  </p>

  <p id="anzeige"></p>

  <!-- Das Spielfeld. Auto und Hindernisse setzt das JavaScript. -->

    <!-- Liegt über dem Spielfeld: Start- und Schlussmeldung -->

  </div>

  <!-- Steuerung zum Anklicken, für Laptop ohne Tastatur -->

    <button class="steuerknopf" onclick="nachLinks()">&#9664;</button>
    <button class="steuerknopf" onclick="nachRechts()">&#9654;</button>
  </div>

  <!-- rangliste.js NACH punkte.js: es braucht serverFragen() und token() von dort. -->
