name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
           # "core" ist in github-script schon eingebaut - kein npm install noetig.
           # Das frühere "npm install" legte eine package.json im Repo-Wurzel-
           # verzeichnis an, worauf Oryx faelschlich ein Node-Projekt vermutete.
           script: |
               return await core.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_WATER_0C6D8C31E }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "/"        # index.html liegt im Wurzelverzeichnis
          api_location: "api"      # der Server-Teil: Konten, Punkte, Muenzen
          output_location: ""      # kein Build -> nichts wird generiert
          skip_app_build: true     # reines HTML/CSS/JS, Oryx komplett ueberspringen
          skip_api_build: false    # der api-Ordner braucht sein npm install
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_WATER_0C6D8C31E }}
          action: "close"
